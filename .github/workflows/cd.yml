name: CD - Deploy to Local IIS

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup.NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish OnlineExamSystem/OnlineExamSystem.csproj -c Release -o C:/inetpub/OnlineExamSystem --no-restore

      - name: Restart IIS Site
        run: |
          Import-Module WebAdministration
          Restart-WebSite -Name "OnlineExamSystem"
        shell: powershell