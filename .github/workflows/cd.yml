name: CD - Deploy to Local IIS

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup.NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Stop IIS Site
        run: |
          Import-Module WebAdministration
          Stop-WebSite -Name "OnlineExamSystem" -ErrorAction SilentlyContinue
          Stop-WebAppPool -Name "OnlineExamSystem" -ErrorAction SilentlyContinue
        shell: powershell

      - name: Publish to IIS folder
        run: dotnet publish OnlineExamSystem/OnlineExamSystem.csproj -c Release -o C:/inetpub/OnlineExamSystem --no-restore
        # If restore missing, use: dotnet publish OnlineExamSystem/OnlineExamSystem.csproj -c Release -o C:/inetpub/OnlineExamSystem

      - name: Start IIS Site
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "OnlineExamSystem" -ErrorAction SilentlyContinue
          Start-WebSite -Name "OnlineExamSystem"
          Write-Host "Deployed!"
        shell: powershell

      - name: Verify files
        run: dir C:\inetpub\OnlineExamSystem
        shell: powershell
